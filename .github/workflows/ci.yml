name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test with branch coverage
        run: pytest --cov=bioprocess_pat --cov-report=term-missing --cov-fail-under=85
      - name: Generate validation evidence
        if: matrix.python-version == '3.12'
        run: python examples/validate_soft_sensor.py
      - name: Upload validation evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: soft-sensor-validation
          path: artifacts/soft_sensor_validation.json
